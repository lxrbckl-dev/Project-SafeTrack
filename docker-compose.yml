services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PORT=8000
      - DATABASE_URL=postgres://highlander:marchpass@postgres:5432/highlander?sslmode=disable
      - OLLAMA_URL=http://ollama:11434
      - SEED_DATA=true

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=highlander
      - POSTGRES_USER=highlander
      - POSTGRES_PASSWORD=marchpass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U highlander -d highlander"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=-1

  ollama-pull:
    image: ollama/ollama
    depends_on:
      - ollama
    entrypoint: ["sh", "-c", "sleep 5 && ollama pull qwen2.5:3b"]
    environment:
      - OLLAMA_HOST=http://ollama:11434
    restart: "no"

  # Flutter web build args — used by Dockerfile.web at build time via --dart-define.
  # Change these values to customize the login page contact info.
  web:
    build:
      context: ./flutter
      dockerfile: ../deploy/docker/Dockerfile.web
      args:
        - SUPPORT_EMAIL=${SUPPORT_EMAIL:-aarbuckle@herzog.com}
        - SUPPORT_PHONE=${SUPPORT_PHONE:-1-816-273-2285}
        - SUPPORT_PHONE_TEL=${SUPPORT_PHONE_TEL:-18162732285}
    ports:
      - "2780:80"
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data:
