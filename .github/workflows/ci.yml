name: CI — Test & Push to DockerHub

on:
  push:
    branches: [main]

env:
  DOCKERHUB_WEB_IMAGE: lxrbckl/pap-highlander-web
  DOCKERHUB_BACKEND_IMAGE: lxrbckl/pap-highlander-backend

jobs:
  test:
    name: Playwright Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: highlander
          POSTGRES_USER: highlander
          POSTGRES_PASSWORD: marchpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U highlander -d highlander"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # --- Go backend ---
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Start Go backend
        working-directory: backend
        env:
          PORT: "8000"
          DATABASE_URL: postgres://highlander:marchpass@localhost:5432/highlander?sslmode=disable
          SEED_DATA: "true"
        run: |
          go build -o server ./cmd/server/
          ./server &
          sleep 5
          curl -sf http://localhost:8000/health

      # --- Flutter web ---
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable

      - name: Build Flutter web
        working-directory: flutter
        run: |
          flutter pub get
          flutter build web

      - name: Serve Flutter web
        working-directory: flutter
        run: |
          npx serve build/web -l 3000 --single --cors &
          sleep 3
          curl -sf http://localhost:3000

      # --- Playwright ---
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Run Playwright tests
        working-directory: playwright
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: npx playwright test --config=playwright.config.ts

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: playwright/test-results/

  push:
    name: Build & Push to DockerHub
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- Backend image ---
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.DOCKERHUB_BACKEND_IMAGE }}:latest
            ${{ env.DOCKERHUB_BACKEND_IMAGE }}:${{ github.sha }}

      # --- Web image ---
      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: ./flutter
          file: ./deploy/docker/Dockerfile.web
          push: true
          build-args: |
            SUPPORT_EMAIL=${{ vars.SUPPORT_EMAIL || 'aarbuckle@herzog.com' }}
            SUPPORT_PHONE=${{ vars.SUPPORT_PHONE || '1-816-273-2285' }}
            SUPPORT_PHONE_TEL=${{ vars.SUPPORT_PHONE_TEL || '18162732285' }}
            API_BASE_URL=${{ vars.API_BASE_URL || 'https://highlander.lxrbckl.com' }}
          tags: |
            ${{ env.DOCKERHUB_WEB_IMAGE }}:latest
            ${{ env.DOCKERHUB_WEB_IMAGE }}:${{ github.sha }}
